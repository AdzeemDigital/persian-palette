name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/core/package-lock.json
      - name: Install studio dependencies
        run: npm ci
      - name: Install core dependencies
        run: npm --prefix packages/core ci
      - name: Build both editions and run tests
        run: npm run check
      - name: Build npm tarball
        run: npm run pack:core
      - name: Install and verify the package and documentation examples
        run: npm run verify:package
      - name: Upload tested output
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 24
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            code_artifact.html
            code_artifact_en.html
            release/persian-palette-core-*.tgz
            docs/build-manifest.json
